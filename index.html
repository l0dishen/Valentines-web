<script>
  const btn = document.querySelector(".no");

  const TRIGGER_RADIUS = 20;   // px
  const ESCAPE_DISTANCE = 100; // px

  let offsetX = 0;
  let offsetY = 0;
  let lastJumpTime = 0;
  let gamestart=false;


  // distance from point to rect
  function pointToRectDistance(px, py, rect) {
    const dx = Math.max(rect.left - px, 0, px - rect.right);
    const dy = Math.max(rect.top - py, 0, py - rect.bottom);
    return Math.hypot(dx, dy);
  }

  function jumpAway() {
    const angle = Math.random() * Math.PI * 2;
    offsetX += Math.cos(angle) * ESCAPE_DISTANCE;
    offsetY += Math.sin(angle) * ESCAPE_DISTANCE;

    btn.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
  }

  document.addEventListener("mousemove", (e) => {
    if (!gamestart) return;
    const now = performance.now();
    if (now - lastJumpTime < 120) return;

    // get rect AFTER current transform
    const rect = btn.getBoundingClientRect();
    const dist = pointToRectDistance(e.clientX, e.clientY, rect);

    if (dist <= TRIGGER_RADIUS) {
      lastJumpTime = now;
      jumpAway();
    }
  });
</script>

<script>
  console.log(gamestart);
  const playButton = document.querySelector(".play");
  const overlay = document.querySelector(".overlay");
  const container = document.querySelector(".container");
  const text2 = document.querySelector(".text2");
  const bottom = document.querySelector(".bottom");
  const yes = document.querySelector(".yes");
  const result = document.querySelector(".result");
  const cutepic = document.querySelector(".cutepic")


  const sfx = new Audio("/ring.wav");
  const bgm = new Audio("/backgroundmusic1.ogg");
  const bgm2 = new Audio("/music.ogg");

  bgm.loop = true;
  bgm.volume = 0.2;
  bgm2.loop = true;
  bgm2.volume = 0.2;
  sfx.volume=0.5;


  function fadeInAudio(audio, targetVolume = 0.2, durationMs = 1000) {
    audio.volume = 0;
    audio.play(); // must be called inside a user gesture

    const steps = 30; // smoother
    const stepTime = durationMs / steps;
    const volumeStep = targetVolume / steps;

    let currentStep = 0;

    const timer = setInterval(() => {
      currentStep++;
      audio.volume = Math.min(targetVolume, audio.volume + volumeStep);

      if (currentStep >= steps) {
        audio.volume = targetVolume;
        clearInterval(timer);
      }
    }, stepTime);
  }
  playButton.addEventListener("click", () => {
    sfx.play();
    // fade out overlay
    overlay.style.opacity = "0";
    overlay.style.pointerEvents = "none";

    // fade in main container
    setTimeout(() => {
      container.style.opacity = "1";
      container.style.pointerEvents = "auto";
      }, 500);


    setTimeout(() => {
      text2.style.opacity="1";
      cutepic.style.opacity="1";
    }, 1000);

    setTimeout(() => {
      bottom.style.opacity="1";
      fadeInAudio(bgm, 0.2, 1000)    }, 1500);
    gamestart=true;

  });

  yes.addEventListener("click",()=> {
    bgm.pause();
    setTimeout(() => {
      sfx.play();
      fadeInAudio(bgm2, 0.1, 1000)    }, 200);
    container.style.opacity = "0";
    container.style.pointerEvents = "none";

    setTimeout(() => {
      result.style.opacity = "1";
      result.style.pointerEvents = "auto";
      const rainTimer = setInterval(spawnDrop, SPAWN_EVERY_MS);
    }, 500);


  })
</script>


<script>
  const rainContainer = document.getElementById("emoji-rain");

  // Customize these
  const EMOJI = "🍣";
  const SPAWN_EVERY_MS = 200;     // smaller value for this means more rain
  const MAX_ON_SCREEN = 80;      // performance cap

  function spawnDrop() {
    if (rainContainer.children.length >= MAX_ON_SCREEN) return;

    const drop = document.createElement("span");
    drop.className = "emoji-drop";
    drop.textContent = EMOJI;

    // Random horizontal position
    const x = Math.random() * 100;
    drop.style.left = x + "vw";

    // Random size
    const size = 14 + Math.random() * 22; // px
    drop.style.fontSize = size + "px";

    // Random duration
    const duration = 2.5 + Math.random() * 3.5; // seconds
    drop.style.animationDuration = duration + "s";

    // Random drift + rotation
    const drift = (Math.random() * 120 - 60).toFixed(1) + "px";
    const rot = (Math.random() * 240 - 120).toFixed(1) + "deg";
    drop.style.setProperty("--drift", drift);
    drop.style.setProperty("--rot", rot);

    // Slight random transparency
    drop.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);

    // Remove when animation ends
    drop.addEventListener("animationend", () => drop.remove());

    rainContainer.appendChild(drop);
  }

</script>
